<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#faf2de"><title>絵本テクテク｜ひみつのちず</title><link rel="stylesheet" href="style.css"></head><body><main id="app">
<section id="cover" class="page paper"><h1>絵本テクテク<br><small>ひみつのちず</small></h1><img class="cover-image" src="assets/cover.png" alt="絵本の国のひみつのちず"><button id="start">ひみつのちずを ひらく</button></section>
<section id="map" class="page paper" hidden><h2>ひみつのちず・おはなしを えらんでね</h2><div class="map-picture"><img src="assets/map.png" alt="６つのお話をつなぐ地図"><div id="pins"></div></div><p id="map-status"></p><button id="passport-btn">パスポートを見る</button></section>
<section id="passport" class="page paper" hidden><h1>えほんおうこく<br><small>パスポート</small></h1><img id="passport-image" src="assets/passport.png" alt="青い絵本王国パスポート"><p id="passport-text"></p><p id="passport-stars" class="stars"></p><button class="back-map">ちずにもどる</button></section>
<section id="game" hidden><nav><button class="back-map">← ちず</button><button id="sound">♪ 音あり</button></nav><div class="game-wrap"><div id="game-heading"></div><div id="board"><canvas id="canvas" width="360" height="600" aria-label="お話のゲーム盤。指を左右に動かし、離すと置けます。"></canvas></div><p id="instruction"></p></div></section>
<div id="result" class="overlay" hidden><div class="result-card"><img id="goal-image" alt="お話のハッピーエンド"><p id="result-message"></p><button id="next">つぎのお話へ</button><div class="result-actions"><button id="again">もう一度遊ぶ</button><button class="back-map">ちずにもどる</button></div></div></div>
</main><script src="game.js"></script></body></html>
